<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Urban Metabolism of Istanbul</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --pembe: #ff70ab;
      --beyaz: #ffffff;
      --açıkPembe: #ffb7d5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Bebas Neue', sans-serif;
      background-color: #ffffff;
      color: #060606;
    }

    .header {
      position: relative;
      background-color: var(--pembe);
      color: white;
      overflow: hidden;
    }

    .header-content {
      padding: 10px 6vw 0px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .header h1 {
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 400;
      letter-spacing: 1px;
    }

    .header h2 {
      font-size: clamp(48px, 12vw, 100px);
      font-weight: 400;
      letter-spacing: 18px;
      margin-top:-2.3vw;
    }

    .svg-curve {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 30vw;
      height: 50px;
      z-index: 1;
      background-color: white;
    }

    .subtitle {
      position: absolute;
      bottom: 10px;
      right: 0;
      color: #cc2f65;
      font-size: clamp(12px, 2vw, 20px);
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      z-index: 2;
      width: calc(30vw - 40px);
    }

    .container {
      padding: 1.5vw 0;
      display: flex;
      justify-content: center;
      gap: 1.5vw;
      flex-wrap: wrap;
    }

    .box {
      width: 31vw;
      height: 31vw;
      border-radius: 20px;
      background-color: #c3ff93;
      display: flex;
      box-shadow: 0 8px 20px #bababa9c;
    }

    .box.about {
      justify-content: flex-end;
      align-items: flex-end;
      text-align: right;
      
    }

    .box.mapping {
      justify-content: flex-start;
      align-items: flex-start;
      text-align: left;
      background-image: url('/images/istanbul.png');
      background-size: cover;
      background-position: center;
    }

    .box.third {
      justify-content: flex-start;
      align-items: flex-start;
      text-align: left;
      background-image: url('/images/yanginvar.png');
      background-size: cover;
      background-position: center;
    }

    .box-content {
      font-size: 36px;
      line-height: 1;
      margin: 20px;
    }

    .box-text {
      font-size: 6vw;
      color: #060606;
      margin-bottom: -0.9vw;
    }

    .box-subtext {
      font-size: 3.8vw;
      color: var(--pembe);
    }

    .box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .box.link:hover {
      filter: brightness(0.95);
      cursor: pointer;
    }

    .box:not(.link):hover {
      filter: none;
      cursor: default;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-content">
      <h1>URBAN METABOLISM OF</h1>
      <h2>ISTANBUL</h2>
    </div>
    <!-- Responsive %60'lık eğri -->
    <svg class="svg-curve" viewBox="0 0 400 30" preserveAspectRatio="none">
        <path d="M 0 0 L 180 0 L 60 0 C 33.626 -2.066 11.9 30 0 30 L 0 0 Z" fill="var(--pembe)"/>
    </svg>

    <div class="subtitle">
      İSTANBUL'UN KENTSEL METABOLİZMASI
    </div>
  </div>

  <div class="container">
    <div class="box about link">
      <div class="box-content">
        <div class="box-text">ABOUT</div>
        <div class="box-subtext">HAKKINDA</div>
      </div>
    </div>

    <div class="box mapping link" onclick="location.href='map.html'">
      <div class="box-content">
        <div class="box-text">MAPPING</div>
        <div class="box-subtext">HARİTALAMA</div>
      </div>
    </div>

    <div class="box third">
    </div>
  </div>

</body>
</html>
